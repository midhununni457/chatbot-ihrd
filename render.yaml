services:
  - type: web
    name: rag-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --workers 1 --threads 8 --timeout 0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False
    healthCheckPath: /
    autoDeploy: true

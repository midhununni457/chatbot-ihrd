<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h1>PDF RAG Chatbot</h1>
        <div class="kb-status" id="kbStatus">
          <span class="status-indicator" id="statusIndicator"></span>
          <span id="statusText">Loading knowledge base status...</span>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
          <div class="message-content">
            Welcome! Ask me questions about the documents in your data
            directory.
          </div>
        </div>
      </div>
      <div class="chat-input-container">
        <input
          type="text"
          id="userInput"
          placeholder="Type your question here..."
          autocomplete="off"
        />
        <button id="sendButton">Send</button>
        <button id="resetButton" title="Reset conversation">Reset</button>
        <button id="reloadKbButton" title="Reload knowledge base">
          Reload KB
        </button>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
